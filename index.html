<script>
(function paymentsApp(){
"use strict";
const $=id=>document.getElementById(id);
const paths={

 manager:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12q9 5 18 0m-9 1v3"/>',

const articleOf=name=>articles.find(a=>a.name===name);
const KEY='demo.public.payments.v1';

const dayNumber=v=>Math.round(Date.parse(v+'T00:00:00Z')/DAY);
const shift=(v,n)=>new Date((dayNumber(v)+n)*DAY).toISOString().slice(0,10);
const fromRu=v=>v.split('.').reverse().join('-');
const dateLabel=(v,opts={day:'numeric',month:'short',year:'numeric'})=>new Date(v+'T00:00:00Z').toLocaleDateString('ru-RU',{...opts,timeZone:'UTC'});
const monday=v=>shift(v,-((new Date(v+'T00:00:00Z').getUTCDay()+6)%7));
const money=n=>(n/100).toLocaleString('ru-RU',{minimumFractionDigits:n%100?2:0,maximumFractionDigits:2,useGrouping:true})+'\u00a0₽';

const countLabel=n=>`${n} ${n%10===1&&n%100!==11?'заявка':n%10>=2&&n%10<=4&&!(n%100>=12&&n%100<=14)?'заявки':'заявок'}`;
const opts=(values,empty)=>[...(empty?['']:[]),...values].map(v=>`<option value="${esc(v)}">${esc(v||empty)}</option>`).join('');

function example(){
 const offset=dayNumber(localDay())-Math.max(...sourceRequests.map(r=>dayNumber(fromRu(r['Дата заявки']))));
 return sourceRequests.map(r=>{
  const created=shift(fromRu(r['Дата заявки']),offset), status=r['Статус'];
  const history=[{at:created,who:r['Сотрудник'],what:'Создана заявка',comment:''}];
  if(status!==statuses[0])history.push({at:'',who:'Из примера',what:status,comment:r['Комментарий']});
  return {id:r['Номер'],created,author:r['Сотрудник'],vendor:r['Получатель'],amount:Math.round(Number(r['Сумма, руб.'])*100),category:r['Статья'],due:shift(fromRu(r['Срок оплаты']),offset),invoice:r['Файл счёта'],status,comment:status===statuses[0]?r['Комментарий']:'',history};
 });
}
function stored(){
 const raw=localStorage.getItem(KEY);
 if(raw===null)return null;
 const list=JSON.parse(raw);
 if(!Array.isArray(list)||!list.every(r=>r&&typeof r.id==='string'&&articleOf(r.category)&&statuses.includes(r.status)&&Number.isSafeInteger(r.amount)&&Array.isArray(r.history)))throw Error('Повреждены данные');
 return list;
}
let rows=[],loadFailed=false;
function storageError(){loadFailed=true;$('storageNote').textContent='Не удалось прочитать или сохранить данные в браузере';}
try{const saved=stored();rows=saved??example();if(saved===null)localStorage.setItem(KEY,JSON.stringify(rows));}
catch{rows=example();storageError();}
let role=roles[0],view='list',week='',cardId=null,timer;
function nearestWeek(){
 const now=monday(localDay());
 const choices=[...new Set(rows.filter(r=>r.status===statuses[2]).map(r=>monday(r.due)))];
 return choices.sort((a,b)=>Math.abs(dayNumber(a)-dayNumber(now))-Math.abs(dayNumber(b)-dayNumber(now))||b.localeCompare(a))[0]||now;
}
function notify(msg){$('toast').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',3700);}
function save(next){
 try{localStorage.setItem(KEY,JSON.stringify(next));}catch{storageError();alert('Не удалось сохранить изменения. Проверьте доступ браузера к локальному хранилищу.');return false;}
 rows=next;loadFailed=false;$('storageNote').innerHTML=icon('device')+'Данные хранятся в этом браузере';return true;
}
function refreshStored(){try{const saved=stored();if(saved)rows=saved;return true;}catch{storageError();alert('Не удалось прочитать сохранённые заявки. Восстановить исходные данные можно кнопкой «Вернуть пример».');return false;}}
function payable(list=rows){return list.filter(r=>r.status===statuses[2]).sort((a,b)=>a.due.localeCompare(b.due)||a.created.localeCompare(b.created)||a.id.localeCompare(b.id,'ru',{numeric:true}));}
function renderStats(){
 const pay=payable();
 const groups=[['К оплате','wallet','blue',pay],['На согласовании','clock','amber',rows.filter(r=>r.status===statuses[1])],['Просрочено к оплате','alert','red',pay.filter(r=>r.due<localDay())],['Оплачено','check','green',rows.filter(r=>r.status===statuses[4])]];
 $('metrics').innerHTML=groups.map(([label,i,color,list])=>`<article class="metric"><div class="klabel"><span class="kicon ${color}">${icon(i)}</span>${label}</div><div class="kvalue">${money(total(list))}</div><div class="knote">${countLabel(list.length)}</div></article>`).join('');
}
const colors=[['#e9efff','#4463a5'],['#f8ece2','#946338'],['#e4f2f0','#31756b'],['#eee9f9','#7958a3'],['#e8f1df','#5e7d41']];
function avatar(name){
 const short=name.replace(/^(ООО|ИП)\s*/,'').replace(/[«»"]/g,'');
 const letters=short.split(/[\s-]+/).slice(0,2).map(x=>x.charAt(0)).join('').toUpperCase();
 const [bg,fg]=colors[Array.from(short).reduce((s,c)=>s+c.charCodeAt(0),0)%colors.length];
 return `<span class="avatar" style="color:${fg};background:${bg}" aria-hidden="true">${esc(letters)}</span>`;
}
function renderList(){
 const q=$('search').value.trim().toLocaleLowerCase('ru');
 const filtered=rows.filter(r=>(!$('status').value||r.status===$('status').value)&&(!$('category').value||r.category===$('category').value)&&r.vendor.toLocaleLowerCase('ru').includes(q));
 if(role===roles[2]){
  const rank=new Map(payable().map((r,i)=>[r.id,i]));
  filtered.sort((a,b)=>(rank.get(a.id)??Infinity)-(rank.get(b.id)??Infinity)||b.created.localeCompare(a.created)||b.id.localeCompare(a.id,'ru',{numeric:true}));
 }else filtered.sort((a,b)=>b.created.localeCompare(a.created)||b.id.localeCompare(a.id,'ru',{numeric:true}));
 const first=role===roles[2]?payable()[0]:null;
 $('queue').innerHTML=first?`<div class="priority">${icon('clock')}<b>К оплате в первую очередь</b><button data-open="${esc(first.id)}">${esc(first.vendor)} · ${money(first.amount)}</button><span>до ${dateLabel(first.due)}</span></div>`:'';
 $('results').innerHTML=filtered.length?`<table class="table"><thead><tr><th>Получатель</th><th>Статья расходов</th><th class="money">Сумма</th><th>Срок оплаты</th><th>Статус</th><th aria-label="Карточка"></th></tr></thead><tbody>${filtered.map(r=>`<tr class="entry" data-open="${esc(r.id)}"><td class="recipient"><div class="vendor">${avatar(r.vendor)}<div><button class="name" data-open="${esc(r.id)}" aria-label="Открыть заявку ${esc(r.id)} — ${esc(r.vendor)}">${esc(r.vendor)}</button><span class="sub">${esc(r.id)} · ${esc(r.author)}</span></div></div></td><td class="category">${esc(r.category)}</td><td class="money">${money(r.amount)}</td><td class="due"><span class="mobile-only">Срок оплаты · </span>${dateLabel(r.due,{day:'numeric',month:'short',...(r.due.slice(0,4)!==localDay().slice(0,4)?{year:'numeric'}:{})})}${r.status===statuses[2]&&r.due<localDay()?'<span class="late">Просрочено</span>':''}</td><td class="statuscell">${pill(r.status)}</td><td class="arrowcell">${icon('right','arrow')}</td></tr>`).join('')}</tbody></table><div class="list-footer"><span>${countLabel(filtered.length)} из ${rows.length}</span><span>Итого <b>${money(total(filtered))}</b></span></div>`:`<div class="empty"><strong>Заявок по этим условиям нет</strong><button class="btn" style="margin:12px auto 0" data-clear>Сбросить фильтры</button></div>`;
}
function renderWeek(){
 if(!week)week=nearestWeek();
 const end=shift(week,6);
 const list=payable().filter(r=>r.due>=week&&r.due<=end);
 const days=Array.from({length:7},(_,i)=>{
  const date=shift(week,i),set=list.filter(r=>r.due===date);
  return `<div class="day ${set.length?'has':''}"><div class="day-head"><b>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</b><span>${date.slice(-2)}.${date.slice(5,7)}</span></div><div class="day-amount">${money(total(set))}</div>${set.map(r=>`<button class="day-item" data-open="${esc(r.id)}">${esc(r.vendor)} · ${money(r.amount)}</button>`).join('')}</div>`;
 }).join('');
 const groups=articles.map(a=>({a,items:list.filter(r=>r.category===a.name)})).filter(g=>g.items.length).sort((a,b)=>total(b.items)-total(a.items));
 $('weekView').innerHTML=`<div class="week-heading"><h2>${dateLabel(week,{day:'numeric',month:'long',...(week.slice(0,4)!==end.slice(0,4)?{year:'numeric'}:{})})} — ${dateLabel(end,{day:'numeric',month:'long',year:'numeric'})}</h2><div class="week-nav"><button class="btn" data-week="-7" aria-label="Предыдущая неделя">${icon('left')}</button><button class="btn small" data-week="0">Ближайшая с оплатами</button><button class="btn" data-week="7" aria-label="Следующая неделя">${icon('right')}</button></div></div><p class="week-total">${countLabel(list.length)} на сумму <b>${money(total(list))}</b></p><div class="days">${days}</div><h3 class="section-heading">По статьям расходов</h3>${groups.map(g=>`<div class="group-row"><span>${esc(g.a.name)}</span><span>${countLabel(g.items.length)}</span><b class="money">${money(total(g.items))}</b></div>`).join('')||'<div class="empty">На этой неделе согласованных платежей нет</div>'}${groups.length?`<div class="group-row"><b>Итого за неделю</b><span>${countLabel(list.length)}</span><b class="money">${money(total(list))}</b></div>`:''}`;
}
function render(){

function historyLabel(v){

}
function openCard(id){

 let actionArea=actions?`<div class="action-area"><div class="actions">${actions}</div></div>`:'';
 if(role===roles[1]&&r.status===statuses[1])actionArea=`<form id="decision" class="action-area"><label class="field-label">Комментарий к решению<textarea name="note" placeholder="Укажите причину решения" required maxlength="2000"></textarea></label><div class="actions"><button class="btn danger" value="reject">Отклонить</button><button class="btn primary" value="approve">Согласовать</button></div></form>`;
 show('Заявка '+id,`<div class="card-top"><h3>${esc(r.vendor)}</h3>${pill(r.status)}</div><div class="big-money">${money(r.amount)}</div><dl class="detail-grid">${detail('Статья расходов',r.category)}${detail('Срок оплаты',dateLabel(r.due))}${detail('Создал',r.author)}${detail('Дата заявки',dateLabel(r.created))}${detail('Файл счёта',r.invoice)}${detail('Согласует по статье',a.approver)}</dl>${r.comment?`<h3 class="section-heading">Комментарий сотрудника</h3><p class="comment">${esc(r.comment)}</p>`:''}${role===roles[1]?budget:''}${actionArea}<h3 class="section-heading">История решений</h3><div>${r.history.map(e=>`<div class="event"><b>${esc(e.what)}</b><small>${esc(e.who)} · ${esc(historyLabel(e.at))}</small>${e.comment?`<p>${esc(e.comment)}</p>`:''}</div>`).join('')}</div>`,id);
}
function newRequest(){
 if(role!==roles[0])return;
 show('Новая заявка',`<form id="newForm"><div class="formgrid"><label class="field-label wide">Получатель<input name="vendor" required maxlength="150" placeholder="Название организации или ИП"></label><label class="field-label">Сумма, ₽<input name="amount" inputmode="decimal" required placeholder="0,00" maxlength="18"></label><label class="field-label">Срок оплаты<input name="due" type="date" required value="${localDay()}" min="1900-01-01" max="9999-12-31"></label><label class="field-label wide">Статья расходов<select name="category" required>${opts(articles.map(a=>a.name),'Выберите статью')}</select></label><label class="field-label wide">Имя файла счёта<input name="invoice" required maxlength="200" placeholder="Например, демо-счёт.pdf"></label><label class="field-label wide">Комментарий <textarea name="comment" maxlength="2000" placeholder="Необязательно"></textarea></label></div><div class="actions"><button type="button" class="btn" data-cancel>Отмена</button><button class="btn primary">Сохранить заявку</button></div></form>`);
}
function validText(field){
 if(field.value.trim())return true;
 field.setCustomValidity('Заполните поле.');field.reportValidity();return false;
}
function createRecord(form){
 if(role!==roles[0]||!validText(form.elements.vendor)||!validText(form.elements.invoice))return;
 const data=Object.fromEntries(new FormData(form)),raw=data.amount.replace(/\s/g,'').replace(',','.');
 const amount=Math.round(Number(raw)*100);
 if(!/^\d+(?:\.\d{1,2})?$/.test(raw)||!Number.isSafeInteger(amount)||amount<=0||amount>99999999999999){form.elements.amount.setCustomValidity('Введите положительную сумму до 999 999 999 999,99 ₽ с точностью до копеек.');form.elements.amount.reportValidity();return;}
 if(!refreshStored())return;
 const id='З-'+(1+Math.max(100,...rows.map(r=>Number(r.id.split('-')[1])||0)));
 const item={id,created:localDay(),author:role,vendor:data.vendor.trim(),amount,category:data.category,due:data.due,invoice:data.invoice.trim(),comment:data.comment.trim(),status:statuses[0],history:[{at:new Date().toISOString(),who:role,what:'Создана заявка',comment:''}]};
 if(!save([...rows,item]))return;
 clearFilters();view='list';render();openCard(id);notify('Заявка сохранена');
}
const transitions={
 submit:[0,0,1,'Отправлена на согласование'],approve:[1,1,2,'Согласована'],reject:[1,1,3,'Отклонена'],pay:[2,2,4,'Оплачена']
};
function advance(action,comment=''){
 const step=transitions[action];if(!step||!cardId||!refreshStored())return;
 const [who,from,to,what]=step,r=rows.find(x=>x.id===cardId);
 if(!r||r.status!==statuses[from]||role!==roles[who]){render();if(r)openCard(r.id);else $('dialog').close();notify('Статус заявки изменился. Данные обновлены.');return;}
 const next={...r,status:statuses[to],history:[...r.history,{at:new Date().toISOString(),who:role===roles[1]&&articleOf(r.category).approver!==role?role+' (демо за финансового директора)':role,what,comment}]};
 if(save(rows.map(x=>x===r?next:x))){render();openCard(r.id);notify('Статус сохранён');}
}
function clearFilters(){$('search').value=$('status').value=$('category').value='';}
$('status').innerHTML=opts(statuses,'Все статусы');$('category').innerHTML=opts(articles.map(a=>a.name),'Все статьи');
$('roles').onclick=e=>{const b=e.target.closest('[data-role]');if(b){role=roles[Number(b.dataset.role)];render();$('roles').querySelector('[aria-pressed="true"]').focus();}};
$('create').onclick=newRequest;
$('listTab').onclick=()=>{view='list';render();};
$('weekTab').onclick=()=>{if(view!=='week')week=nearestWeek();view='week';render();};
$('status').onchange=$('category').onchange=$('search').oninput=renderList;
$('close').onclick=()=>$('dialog').close();
$('dialog').addEventListener('close',()=>{cardId=null;});
$('dialogBody').addEventListener('input',e=>e.target.setCustomValidity?.(''));
$('dialogBody').addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='newForm')createRecord(e.target);
 if(e.target.id==='decision'&&e.submitter&&validText(e.target.elements.note))advance(e.submitter.value,e.target.elements.note.value.trim());
});
$('reset').onclick=()=>show('Вернуть пример?',`<p>Текущие заявки и история изменений будут заменены 14 заявками из примера. Даты будут пересчитаны на сегодня.</p><div class="actions"><button class="btn" data-cancel autofocus>Отмена</button><button class="btn primary" data-restore>Вернуть пример</button></div>`);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-open],[data-act],[data-week],[data-clear],[data-cancel],[data-restore]');if(!b)return;
 if(b.hasAttribute('data-open'))openCard(b.dataset.open);
 else if(b.hasAttribute('data-act'))advance(b.dataset.act);
 else if(b.hasAttribute('data-week')){week=b.dataset.week==='0'?nearestWeek():shift(week,Number(b.dataset.week));renderWeek();$('weekView').querySelector(`[data-week="${b.dataset.week}"]`).focus();}
 else if(b.hasAttribute('data-clear')){clearFilters();renderList();}
 else if(b.hasAttribute('data-cancel'))$('dialog').close();
 else if(b.hasAttribute('data-restore')&&save(example())){clearFilters();week=nearestWeek();$('dialog').close();render();notify('Исходный пример восстановлен');}
});
window.addEventListener('storage',e=>{if(e.key!==KEY&&e.key!==null)return;if(refreshStored()){render();if(cardId&&$('dialog').open){if(rows.some(r=>r.id===cardId))openCard(cardId);else $('dialog').close();}}});
render();
})();
</script>
</body>
</html>
